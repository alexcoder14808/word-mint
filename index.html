function valid(w){return /^[a-z]{5}$/.test(w)&&WORDS.has(w)}function pick(){let p=ANSWERS.filter(w=>!save.used.includes(w));if(!p.length){save.used=[];p=ANSWERS}let w=p[Math.floor(Math.random()*p.length)];save.used.push(w);if(save.used.length>100)save.used.shift();persist();return w.toUpperCase()}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function home(){closeModal();history.replaceState({},'',location.pathname);show('home');persist()}
function newGame(word=null){if(!word)history.replaceState({},'',location.pathname);game={answer:(word||pick()).toUpperCase(),guesses:[],current:'',over:false,extra:0,hints:{},custom:!!word};keys={};$('title').textContent=word?'Custom Wordle':'Unlimited Wordle';$('notice').textContent='';buildBoard();buildKeys();show('game')}
function buildBoard(){let b=$('board');b.innerHTML='';for(let r=0;r<6+(game.extra||0);r++){let row=document.createElement('div');row.className='row';for(let c=0;c<5;c++){let t=document.createElement('div');t.className='tile';t.id='t'+r+c;row.appendChild(t)}b.appendChild(row)}}
function kb(label,id){let b=document.createElement('button');b.className='key'+(label.length>1?' wide':'');b.textContent=label;b.dataset.key=id;b.onclick=()=>id==='ENTER'?submit():id==='BACK'?back():press(id);return b}function buildKeys(){let k=$('keyboard');k.innerHTML='';['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach((s,i)=>{let r=document.createElement('div');r.className='keyrow';if(i===2)r.appendChild(kb('ENTER','ENTER'));for(let c of s)r.appendChild(kb(c,c));if(i===2)r.appendChild(kb('⌫','BACK'));k.appendChild(r)})}
function press(c){if(!game||game.over)return;if(game.current.length<5){game.current+=c;render()}}function back(){if(game&&!game.over){game.current=game.current.slice(0,-1);render()}}function render(){let r=game.guesses.length;for(let c=0;c<5;c++){let t=$('t'+r+c);if(t){t.textContent=game.current[c]||'';t.className='tile'+(game.current[c]?' filled':'')}}}
function submit(){if(!game||game.over)return;if(game.current.length<5)return note('Enter a 5-letter word.');let w=game.current.toLowerCase();if(!valid(w))return note('Not in the word library.');evalGuess(w)}
function evalGuess(w){let a=game.answer.toLowerCase(),res=Array(5).fill('absent'),used=Array(5).fill(false);for(let i=0;i<5;i++)if(w[i]===a[i]){res[i]='correct';used[i]=true}for(let i=0;i<5;i++)if(res[i]!=='correct')for(let j=0;j<5;j++)if(!used[j]&&w[i]===a[j]){res[i]='present';used[j]=true;break}let r=game.guesses.length;game.guesses.push({w,res});for(let i=0;i<5;i++){let t=$('t'+r+i);t.textContent=w[i].toUpperCase();t.className='tile '+res[i];let old=keys[w[i]],rank={absent:1,present:2,correct:3};if(!old||rank[res[i]]>rank[old])keys[w[i]]=res[i]}updateKeys();game.current='';if(w===a)return finish(true);if(game.guesses.length>=6+game.extra)finish(false)}
function updateKeys(){document.querySelectorAll('.key').forEach(b=>{let k=(b.dataset.key||'').toLowerCase(),st=keys[k];b.className='key'+(b.textContent.length>1?' wide':'')+(st?' '+st:'');b.dataset.state=st||'';if(st==='absent')b.setAttribute('aria-label',k.toUpperCase()+' not in word');else if(st==='present')b.setAttribute('aria-label',k.toUpperCase()+' is in the word');else if(st==='correct')b.setAttribute('aria-label',k.toUpperCase()+' is correct')})}
function finish(win){game.over=true;save.games++;if(win){save.wins++;save.streak++;save.best=Math.max(save.best,save.streak);if(!game.custom)save.coins+=50;if(game.guesses.length<=6)save.dist[game.guesses.length-1]++;confetti();note(game.custom?'Custom Wordle solved!':'Solved! +50 coins')}else{save.losses++;save.streak=0;note('The word was '+game.answer+'.')}persist();setTimeout(()=>{result(win);setTimeout(()=>{closeModal();home()},4500)},1400)}
function result(win){let txt='WordMint '+(game.guesses.length<=6?game.guesses.length:'X')+'/6\n'+game.guesses.map(g=>g.res.map(x=>x==='correct'?'🟩':x==='present'?'🟨':'⬜').join('')).join('\n');open('<div class="result"><h2>'+(win?'Puzzle solved!':'Puzzle complete')+'</h2><p>The answer was <b>'+game.answer+'</b>.</p><div class="sharebox"><input id="resultText" readonly><button class="btn" onclick="copyResult()">'+ICONS.copy+' Copy</button></div><div class="gamebar"><button class="btn primary" onclick="closeModal();home()">'+ICONS.home+' Home</button><button class="btn" onclick="closeModal();newGame()">'+ICONS.plus+' New Wordle</button></div></div>');$('resultText').value=txt}
function copyResult(){navigator.clipboard?.writeText($('resultText').value);note('Result copied!')}
function shop(){if(!game)return open('<h2>'+ICONS.shop+' Hint Shop</h2><p>Start a Wordle first, then you can spend coins on hints.</p><div class="hint">You received a one-time <b>100-coin starter bonus</b> so you can test the shop.</div>');open('<h2>'+ICONS.shop+' Hint Shop</h2><p>You have <b>'+save.coins+'</b> coins.</p><div class="shop">'+item('Reveal a letter','Reveals one position in the answer.','letter',60)+item('First letter','Reveals the first letter.','first',90)+item('Last letter','Reveals the last letter.','last',90)+item('Find a vowel','Reveals a vowel in the answer.','vowel',40)+item('Find a consonant','Reveals a consonant in the answer.','consonant',45)+item('Eliminate a letter','Reveals a letter that is not in the answer.','eliminate',50)+item('Eliminate 3 letters','Marks three letters absent on your keyboard.','eliminate3',100)+item('Reveal a pattern','Shows all revealed positions.','pattern',75)+item('Extra guess','Adds one additional guess.','guess',100)+item('Word clue','Gives a clue about the answer.','clue',75)+'</div><div id="hintResult" class="hint-result" style="display:none"></div><div class="hint">Win a normal Wordle for <b>50 coins</b>. Custom puzzles do not award coins.</div>')}
function item(a,b,t,c){return '<div class="item"><div><b>'+a+'</b><small>'+b+'</small></div><button class="btn" onclick="buy(\''+t+'\')">'+ICONS.coin+' '+c+'</button></div>'}
function showHint(s){let box=$('hintResult');if(box){box.style.display='block';box.innerHTML=s}else note(s)}
function buy(t){if(!game)return showHint('Start a Wordle first.');const cost={letter:60,first:90,last:90,vowel:40,consonant:45,eliminate:50,eliminate3:100,pattern:75,guess:100,clue:75}[t];if(save.coins<cost)return showHint('You need <b>'+cost+' coins</b>, but you only have <b>'+save.coins+'</b>.');if(t==='letter'&&game.hints.letter)return showHint('You already used the general letter-reveal hint.');save.coins-=cost;let ans=game.answer.toUpperCase();if(t==='letter'){let used=game.hints.pos||[],av=[0,1,2,3,4].filter(x=>!used.includes(x));if(!av.length){save.coins+=cost;return showHint('All five positions are already revealed. Coins refunded.')}let p=av[Math.floor(Math.random()*av.length)];game.hints.pos=[...used,p];game.hints.letter=true;showHint('Position <b>'+(p+1)+'</b> is <strong>'+ans[p]+'</strong>.')}else if(t==='first'){showHint('The first letter is <strong>'+ans[0]+'</strong>.')}else if(t==='last'){showHint('The last letter is <strong>'+ans[4]+'</strong>.')}else if(t==='vowel'){let v=[...new Set(ans.match(/[AEIOU]/g)||[])];showHint(v.length?'A vowel in the answer is <strong>'+v[Math.floor(Math.random()*v.length)]+'</strong>.':'This word has <strong>no standard vowel</strong>.')}else if(t==='consonant'){let v=[...new Set([...ans].filter(x=>!"AEIOU".includes(x)))];showHint(v.length?'A consonant in the answer is <strong>'+v[Math.floor(Math.random()*v.length)]+'</strong>.':'The answer has no consonants.')}else if(t==='eliminate'||t==='eliminate3'){let n=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].filter(x=>!ans.includes(x));let count=t==='eliminate3'?3:1;let picked=n.sort(()=>Math.random()-.5).slice(0,count);picked.forEach(x=>keys[x.toLowerCase()]='absent');updateKeys();showHint('Not in the answer: <strong>'+picked.join(' &nbsp; ')+'</strong>.<br>Your keyboard has been updated.')}else if(t==='pattern'){let pos=game.hints.pos||[];let pat=[0,1,2,3,4].map(i=>pos.includes(i)?ans[i]:'_').join(' ');showHint('Current revealed pattern:<br><strong>'+pat+'</strong>')}else if(t==='guess'){game.extra++;buildBoard();game.guesses.forEach((g,r)=>g.w.split('').forEach((x,i)=>{let z=$('t'+r+i);z.textContent=x.toUpperCase();z.className='tile '+g.res[i]}));updateKeys();showHint('An <strong>extra guess</strong> has been added.')}else if(t==='clue'){let vowels=[...new Set([...ans].filter(x=>"AEIOU".includes(x)))];let consonants=[...new Set([...ans].filter(x=>!"AEIOU".includes(x)))];let clue=vowels.length?'The answer contains the vowel <strong>'+vowels[0]+'</strong>.':'The answer contains no standard vowel.';if(consonants.length)clue+=' It also contains the consonant <strong>'+consonants[0]+'</strong>.';showHint(clue)}persist()}
function custom(){open('<h2><span class="modal-title-icon">'+ICONS.link+'</span> Create a Custom Wordle</h2><p>Choose any valid five-letter word. WordMint will generate a link that opens the puzzle directly in a browser.</p><div class="form"><label for="cw">Secret word</label><input id="cw" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="VOZHD"><label for="cc">Optional clue</label><input id="cc" maxlength="80" placeholder="A clue for your players"></div><button class="btn primary" style="margin-top:12px" onclick="makeCustom()">'+ICONS.link+' Create shareable link</button><div id="cr"></div><div class="hint">When this file is hosted on GitHub Pages or another website, the generated URL is a real shareable puzzle link. Players do not need an account.</div>')}
function playCreatedCustom(){let w=$('cl').dataset.word;if(w){closeModal();newGame(w.toUpperCase())}}
function makeCustom(){let w=$('cw').value.trim().toLowerCase();if(!valid(w))return note('That word is not in the WordMint library.');let clue=$('cc').value.trim();let base=location.href.split('?')[0].split('#')[0];let url=base+'?custom='+encodeURIComponent(w)+(clue?'&clue='+encodeURIComponent(clue):'');$('cr').innerHTML='<div class="hint"><b>Custom puzzle ready</b><br>Send this link to your friends:</div><div class="sharebox"><input id="cl" readonly><button class="btn" onclick="copyCustom()">'+ICONS.copy+' Copy</button></div><div class="gamebar"><button class="btn primary" onclick="playCreatedCustom()">'+ICONS.check+' Play now</button>'+(navigator.share?'<button class="btn" onclick="shareCustom()">'+ICONS.share+' Share</button>':'')+'</div>';$('cl').value=url;$('cl').dataset.word=w}function copyCustom(){copyText($('cl').value);note('Custom link copied!')}async function shareCustom(){let u=$('cl').value;if(navigator.share){try{await navigator.share({title:'WordMint Custom Wordle',text:'Play my custom WordMint puzzle',url:u})}catch(e){}}}async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){let a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
function stats(){open('<h2>'+ICONS.stats+' Statistics</h2><div class="stats"><div class="stat"><b>'+save.games+'</b>Played</div><div class="stat"><b>'+save.wins+'</b>Wins</div><div class="stat"><b>'+save.streak+'</b>Streak</div><div class="stat"><b>'+save.best+'</b>Best</div></div><h3>Guess Distribution</h3>'+save.dist.map((n,i)=>'<div>'+ (i+1)+' guesses: <b>'+n+'</b></div>').join('')+'<p>'+ICONS.coin+' <b>'+save.coins+'</b> coins</p><div class="gamebar"><button class="btn" onclick="toggleDark()">Dark mode</button><button class="btn" onclick="resetStats()">Reset statistics</button></div>')}
function resetStats(){if(confirm('Reset WordMint statistics and coins?')){save={coins:0,wins:0,losses:0,streak:0,best:0,games:0,dist:[0,0,0,0,0,0],used:[],dark:save.dark};persist();closeModal()}}function toggleDark(){save.dark=!save.dark;persist()}function open(x){$('content').innerHTML=x;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}function note(s){$('notice').textContent=s;clearTimeout(window.nt);window.nt=setTimeout(()=>$('notice').textContent='',3500)}
function confetti(){let c=$('confetti');c.innerHTML='';let colors=['#6aaa64','#c9b458','#4f86c6','#e76f51','#8e6ac8'];for(let i=0;i<120;i++){let p=document.createElement('i');p.className='conf';p.style.left=Math.random()*100+'%';p.style.top=(-Math.random()*20)+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.35+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',2400)}
document.addEventListener('keydown',e=>{if($('modal').style.display==='flex')return;if(e.key==='Enter')submit();else if(e.key==='Backspace')back();else if(/^[a-z]$/i.test(e.key))press(e.key.toUpperCase())});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function load(){let p=new URLSearchParams(location.search),w=p.get('custom');if(!w&&location.hash.startsWith('#custom=')){w=location.hash.slice(8).split('&')[0]}if(w&&valid(w.toLowerCase())){newGame(w.toUpperCase());let clue=p.get('clue');if(clue)$('title').textContent='Custom Wordle • '+clue}else home()}persist();load();
</script></body></html>
